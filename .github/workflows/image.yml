# Build, publish and release deter-guard.
#
# This is the image SREs put in their pipelines, so the supply chain OF THE THING THAT GUARDS THE
# SUPPLY CHAIN matters more than usual:
#   * multi-arch (amd64 + arm64), cross-compiled by Go rather than emulated — no QEMU;
#   * a build provenance attestation, so a customer can prove the image came from THIS repository and
#     not from somebody's laptop — which only works if the repo is public, since verification reads
#     it. That's the reason the guard lives here rather than inside the private console repo;
#   * third-party actions pinned to commit SHAs.
#
# RELEASING. The version lives in one place: the `VERSION` file. A pull request that changes it is
# a release; every merge to main whose VERSION is already tagged is not. That is deliberately an
# explicit, reviewed act rather than something inferred from commit-message prefixes — the difference
# between 1.3.0 and 2.0.0 is a promise to everyone pinning `@v1`, and it should be made by a person
# in a diff, not by a regex over a subject line.
#
# The `conventions` job below is the other half of that. Commit types never PICK the version, but
# they do set a floor under it: a `feat:` that has landed since the last tag means the next release
# cannot be a patch, and a `!` means it can only be a major. A person still chooses; CI refuses a
# choice that would quietly break everyone pinned to `@v1`. See CONTRIBUTING.md.
#
# When VERSION names something not yet tagged, a push to main:
#   1. builds and pushes the image tagged 1.2.3, 1.2, 1 and latest;
#   2. tags the commit v1.2.3 and MOVES v1.2 and v1 onto it, so `uses: …@v1` resolves;
#   3. cuts a GitHub Release with generated notes and the image digest.
#
# Steps 1 and 3 live in one workflow on purpose. Pushing a tag with GITHUB_TOKEN does not start
# another workflow run — GitHub refuses, to stop workflows triggering themselves — so a separate
# tag-then-build design would silently never build, or need a PAT this repository does not want.
#
# Tags produced:
#   ghcr.io/<owner>/deter-guard:sha-<sha>          every push (immutable — the strongest pin)
#   ghcr.io/<owner>/deter-guard:main               every push to main (tip of trunk, unreleased)
#   ghcr.io/<owner>/deter-guard:1.2.3, :1.2, :1    a release
#   ghcr.io/<owner>/deter-guard:latest             the newest RELEASE, not the tip of main
#
# Setup: none. GITHUB_TOKEN can publish to this repository's own package registry and push tags.
# If tag protection rules are ever added, `v*` has to admit github-actions[bot] or step 2 fails.
name: Image

on:
  push:
    branches: [main]
    # A tag pushed by hand still builds its image, for the case where a release has to be cut from
    # somewhere other than a merge. The release job below stays out of the way of one.
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: image-${{ github.ref }}
  # Superseding a pull request build is free; superseding a release half-way through is not — it can
  # leave an image pushed with no tag pointing at it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      # 1.2.3 — what VERSION says, always.
      version: ${{ steps.v.outputs.version }}
      major: ${{ steps.v.outputs.major }}
      minor: ${{ steps.v.outputs.minor }}
      # "true" only when this very run should cut the release.
      release: ${{ steps.v.outputs.release }}
      # What gets stamped into the binary — see below, this is not always `version`.
      build: ${{ steps.v.outputs.build }}
    steps:
      # fetch-depth stays at 1: the tag lookup asks the remote rather than the local clone, which is
      # both authoritative and cheaper than fetching every tag to answer one question.
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)

          # Refuse anything the image tagging and the `@v1` convention cannot represent. A typo here
          # would otherwise become a permanent tag on a public registry.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR.PATCH — got '$version'"
            exit 1
          fi
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}

          released=false
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            released=true
          fi

          release=false
          build="$version-dev.${SHA:0:7}"
          case "$REF" in
            refs/tags/*)
              # A hand-pushed tag. The tag already exists, so there is nothing to release — but the
              # binary must not claim a version other than the one being tagged.
              tag=${REF#refs/tags/}
              if [ "$tag" != "v$version" ]; then
                echo "::error file=VERSION::tag $tag does not match VERSION ($version). Bump VERSION in the commit you are tagging."
                exit 1
              fi
              build=$version
              ;;
            refs/heads/main)
              if [ "$EVENT" = push ] && [ "$released" = false ]; then
                release=true
                build=$version
              fi
              ;;
          esac

          # Anything that is not itself a release is stamped 1.2.3-dev.<sha>: a prerelease of the
          # version being worked towards, so it sorts BELOW 1.2.3 and `--version` never claims to be
          # a release it is not.
          {
            echo "version=$version"
            echo "major=$major"
            echo "minor=$minor"
            echo "release=$release"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

          # Say plainly, on the run summary, whether merging this cuts a release. A version bump
          # that was forgotten is otherwise a silent no-op, which is the failure mode of every
          # scheme like this one.
          if [ "$release" = true ]; then
            echo "Releasing **v$version**." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$released" = false ]; then
            echo "Merging this cuts release **v$version**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: **v$version** is already tagged. Bump \`VERSION\` to cut a new one." >> "$GITHUB_STEP_SUMMARY"
          fi

  conventions:
    name: Conventions
    runs-on: ubuntu-latest
    steps:
      # Full history and tags. The version floor is computed against everything since the last
      # release tag, not against this branch alone — a feature merged last week still has to be
      # covered by the number the next release publishes.
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0

      - name: Check the branch, the commits and VERSION
        # A pull request title and body are written by whoever opened it, which on a public
        # repository is anybody. They reach node through the environment and are never interpolated
        # into a shell command — `${{ }}` inside `run:` is textual substitution.
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/check.js

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.25"
          # There is no go.sum, because there are no dependencies. Leaving the cache on makes the
          # run warn about a missing file that should never exist.
          cache: false
      # No `go mod download`: there are no dependencies. If that ever stops being true, `go build`
      # will say so rather than silently pulling something in.
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go vet ./...
      - run: go test ./...

      # The action is JavaScript, so `go test` never touched it — and the first thing it shipped
      # with was a bug that silently skipped attestation verification while still going green.
      # Node's built-in runner, no dependencies, same rule as the action itself.
      #
      # Named explicitly rather than `--test action/`, because the runner would otherwise execute
      # main.js, which is a program and not a test.
      - run: node --test action/inputs.test.js

      # The rules that decide whether a release may happen at all. Wrong quietly, if wrong.
      - run: node --test ci/semantic.test.js

  image:
    name: Build and publish
    needs: [version, test]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      # Required to attach the provenance attestation below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      # No setup-qemu: the Dockerfile compiles natively on the builder and targets each platform
      # with GOOS/GOARCH, so there's nothing to emulate.
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to ghcr.io
        # Skipped on pull requests: a fork's token can't push, and an untrusted PR must never be able
        # to publish an image people pull into their pipelines.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/deter-guard
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=${{ needs.version.outputs.major }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=deter-guard
            org.opencontainers.image.description=Fetch and verify an organization's signed egress policy from CI. Static binary in a scratch image.

      - id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Not meta.outputs.version, which is whichever tag happened to sort first and is the branch
          # name on a branch build. `deter-guard --version` should answer with the release, or with
          # an unmistakable 1.2.3-dev.<sha> when it is not one.
          build-args: |
            VERSION=${{ needs.version.outputs.build }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lets a customer prove where the image came from:
      #   gh attestation verify oci://ghcr.io/<owner>/deter-guard:1 --repo <owner>/deter-guard
      - name: Attest provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/deter-guard
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke test the published image
        if: github.event_name != 'pull_request'
        # A tag that exists but whose entrypoint is broken is worse than a failed build — it fails in
        # somebody else's pipeline instead of ours. Pull by DIGEST so this tests the artifact that was
        # just pushed, not whatever `latest` happens to resolve to.
        #
        # Values reach the shell through env, never interpolated into the script: `${{ }}` inside
        # `run:` is textual substitution, so it's a command-injection shape even when the specific
        # value can't contain anything dangerous.
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/deter-guard
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}@${DIGEST}" --help
          got=$(docker run --rm "${IMAGE}@${DIGEST}" --version)
          # A release whose binary reports the wrong version is a support ticket that takes an hour
          # to believe. The ldflags stamp is one typo away from silently not applying.
          if [ "$got" != "$EXPECTED" ]; then
            echo "::error::image reports version '$got', expected '$EXPECTED'"
            exit 1
          fi
          echo "version stamp verified: $got"

  release:
    name: Tag and release
    # `conventions` is a release gate, not just a lint: it is what refuses a 1.0.1 that carries a
    # feature. A failure there must stop the tag being pushed, not merely turn the run red.
    needs: [version, image, conventions]
    # Only a merge to main cuts a release, and only when VERSION names something not yet tagged.
    # A hand-pushed tag is excluded: its tag already exists, so there is nothing here to create.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      # To push the tags and create the release. Nothing else in this workflow can write to the repo.
      contents: write
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Tag
        env:
          V: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
          MINOR: ${{ needs.version.outputs.minor }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # v1.2.3 is immutable and goes first: if anything below fails, the release can be finished
          # by hand from a tag that already points at the right commit.
          git tag -a "v$V" -m "deter-guard v$V"
          git push origin "refs/tags/v$V"

          # v1.2 and v1 MOVE. That is the convention `uses: …@v1` depends on, and it is why this
          # repository cannot simply never force-push a tag: a major series that does not advance
          # means everyone pinned to it is frozen at the first release forever.
          git tag -f -a "v$MAJOR.$MINOR" -m "deter-guard v$MAJOR.$MINOR -> v$V"
          git tag -f -a "v$MAJOR" -m "deter-guard v$MAJOR -> v$V"
          git push --force origin "refs/tags/v$MAJOR.$MINOR" "refs/tags/v$MAJOR"

      # If this step fails after the tags above have been pushed, a re-run will not retry it: the
      # version job will see v1.2.3 on the remote and decide there is nothing to release. Finish it
      # by hand instead — the tags are already correct:
      #
      #   gh release create v1.2.3 --verify-tag --title v1.2.3 --generate-notes
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          V: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/deter-guard
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail

          # GitHub writes the "what changed" half from the merged pull requests. Asked for
          # separately rather than via `--generate-notes`, which would replace the preamble below
          # rather than follow it.
          gh api "repos/$REPO/releases/generate-notes" -f tag_name="v$V" -q .body > generated.md

          {
            echo '```yaml'
            echo "- uses: $REPO@v$V   # or @v$MAJOR to follow this major series"
            echo '```'
            echo
            echo "The action pulls the image built from this same commit, so the pin above pins the"
            echo "binary too."
            echo
            echo '```'
            echo "$IMAGE:$V"
            echo "$IMAGE@$DIGEST"
            echo "gh attestation verify oci://$IMAGE:$V --repo $REPO"
            echo '```'
            echo
            cat generated.md
          } > notes.md

          # --verify-tag: refuse to invent a tag. If the step above somehow did not push one, fail
          # rather than quietly create a release pointing somewhere else.
          gh release create "v$V" --repo "$REPO" --verify-tag --title "v$V" --notes-file notes.md

          echo "Released **v$V** — $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
